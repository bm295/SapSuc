name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SapSuc.sln

      - name: Build
        run: dotnet build SapSuc.sln --configuration Release --no-restore

      # SapSuc.Tests is a console test runner that returns a nonzero exit code on failure.
      - name: Run tests
        run: dotnet run --project tests/SapSuc.Tests/SapSuc.Tests.csproj --configuration Release --no-build
